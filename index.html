 <body>
    <nav class="navbar hp-navbar">
        <div class="container d-flex justify-content-between align-items-start position-relative">
            <div class="hp-logo-part">
                <a class="navbar-brand" href="#"><img src="img/logo.png" width="179"></a>
            </div>
    
            <div class="hp-nav-center-card">
                <ul class="navbar-nav d-flex flex-row">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>

<header class="hp-hero-section">
  <div class="container text-center">
      <h1 class="hp-hero-title">Find Your Safe Home Away From<br> Home</h1>
      <p class="hp-hero-subtitle">Our housing is designed to give expatriates a secure, comfortable.</p>

      <div class="hp-search-container p-4 mt-5">
        <h5 class="hp-search-label text-start mb-4">Search For Available Properties</h5>
          <div class="row g-3">
              <div class="col-md-3 align-items-center">
                  <input type="text" id="Locationinput" class="form-control hp-custom-input" placeholder="Location">
              </div>
              <div class="col-md-3">
                  <select  id="typeselect" class="form-select hp-custom-input">
                      <option value="" selected>Property Type ▲</option>
                      <option value="Apartment">Apartment</option>
                      <option value="Villa">Villa</option>
                  </select>
              </div>
              <div class="col-md-3">
                  <input type="number" id="Budgetinput" class="form-control hp-custom-input" placeholder="Budget">
              </div>
              <div class="col-md-3">
                  <button id="Searchbtn" class="btn btn-dark w-100 hp-btn-search">Search</button>
              </div>
          </div>
      </div>
  </div>

  <div class="hp-floating-badge">
      <img src="img/nn.png" alt="Icon">
  </div>
