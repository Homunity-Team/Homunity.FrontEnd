<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <!-- ملف يتبعه جميع المبرمجين -->
    <link rel="stylesheet" href="css/normalize.css">
    <!-- ملف الايكونات  -->
    <link rel="stylesheet" href="css/all.min.css">
    <!-- ملف bootstrab . css  -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!--  ملفات عدل الاسم css الخارجيه -->
    <link rel="stylesheet" href="css/main.css">
    <!-- تنسقات خطوط جوجل  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <section class="hp-hero-wrapper">
    
        <nav class="navbar navbar-expand-lg hp-navbar">
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand hp-logo" href="#">
                    <img src="img/logo.png" alt="Logo" width="179">
                </a>
    
                <ul class="navbar-nav hp-nav-links d-flex flex-row">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Properties</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
                <div class="hp-auth">
                    <a href="#" class="hp-auth-link">Login</a> / 
                    <a href="#" class="hp-auth-link">Register</a>
                </div>
            </div>
        </nav>
        <div class="container text-center hp-hero-content">
            <h1 class="hp-title">Find Your Safe Home Away From Home</h1>
            <p class="hp-subtitle">Our housing is designed to give expatriates a secure, comfortable.</p>
            <div class="hp-search-container mx-auto">
                <h5 class="hp-search-label text-start mb-3">Search For Available Properties</h5>
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" id="location" class="form-control hp-field" placeholder="Location">
                    </div>
                    <div class="col-md-3">
                        <select id="propertyType" class="form-select hp-field">
                            <option selected>Property Type ▲</option>
                            <option value="apartment">Apartment</option>
                            <option value="villa">Villa</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="budget" class="form-control hp-field" placeholder="Budget">
                    </div>
                    <div class="col-md-3">
                        <button class="btn hp-btn-search w-100" onclick="searchProperties()">Search</button>
                    </div>
                </div>
            </div>
        </div>
    
    </section>
            







    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
    <!-- ملف bootstrab . js  -->
</body>

</html>
