<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>إضافة عقار - نظام المواقع الذكي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 400px;
            border-radius: 15px;
            margin-bottom: 15px;
            z-index: 1;
        }

        body {
            background: #f8fafc;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-btn {
            border-radius: 10px 0 0 10px;
        }

        /* تعديل للـ RTL */
        .search-input {
            border-radius: 0 10px 10px 0;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div id="loader" class="loading-overlay">
        <div class="spinner-border text-primary"></div>
    </div>

    <div class="container card p-4 shadow-sm">
        <h4 class="text-primary mb-3">إضافة موقع عقار جديد</h4>

        <div class="search-container">
            <label class="fw-bold small mb-1">ابحث عن منطقة (مثلاً: بنها، المنشية):</label>
            <div class="input-group">
                <input type="text" id="locationSearch" class="form-control search-input"
                    placeholder="اكتب اسم المكان هنا...">
                <button class="btn btn-dark search-btn" onclick="searchLocation()">🔍 بحث</button>
            </div>
        </div>

        <div id="map"></div>

        <div class="mb-3">
            <label class="fw-bold small">العنوان المختار:</label>
            <input type="text" id="addr" class="form-control" readonly placeholder="سيظهر العنوان هنا عند النقر">
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="fw-bold small text-success">أقرب جامعة لهذا الموقع:</label>
                <input type="text" id="uni" class="form-control fw-bold" readonly>
            </div>
            <div class="col-md-4 mb-3">
                <label class="fw-bold small text-danger">المسافة للجامعة:</label>
                <input type="text" id="distance" class="form-control fw-bold" readonly placeholder="0 كم">
            </div>
        </div>

        <button id="saveBtn" onclick="saveData()" class="btn btn-primary w-100 btn-lg shadow-sm" disabled>حفظ العقار في
            النظام</button>
        <a href="view.html" class="btn btn-link w-100 mt-2 text-decoration-none text-muted small">الذهاب لصفحة عرض كل
            العقارات ←</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // دالة لجلب الـ ID من رابط الصفحة
        const urlParams = new URLSearchParams(window.location.search);
        const propertyIdFromUrl = urlParams.get('id');

        // التأكد أن الـ ID موجود، وإلا نرجعه لصفحة الإضافة
        if (!propertyIdFromUrl) {
            alert("عذراً، لم يتم تحديد رقم العقار!");
            window.location.href = "add-property.html"; // اسم صفحة الإضافة عندك
        }
        // المتغيرات العالمية
        let universities = [];
        let selectedUniversityId = null;
        let lastSelectedCoords = null;
        const API_BASE = "https://homunityapiv1.runasp.net/api";

        // إعداد الخريطة
        const map = L.map('map').setView([30.470, 31.184], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let marker;

        // 1. جلب الجامعات من الباك-إند عند تشغيل الصفحة
        async function fetchUniversities() {
            try {
                const response = await fetch(`${API_BASE}/Universities/GetAll`);
                const data = await response.json();
                universities = data.universities;
                console.log("تم تحميل الجامعات:", universities.length);
            } catch (error) {
                console.error("خطأ في جلب الجامعات:", error);
                alert("حدث خطأ أثناء تحميل بيانات الجامعات.");
            }
        }

        // تشغيل الجلب فوراً
        fetchUniversities();

        // دالة البحث عن مكان
        async function searchLocation() {
            const query = document.getElementById('locationSearch').value;
            if (!query) return;

            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&countrycodes=eg`);
            const data = await res.json();

            if (data.length > 0) {
                const { lat, lon, display_name } = data[0];
                const coords = { lat: parseFloat(lat), lng: parseFloat(lon) };
                map.flyTo([coords.lat, coords.lng], 15);
                updateSelection(coords.lat, coords.lng, display_name);
            }
        }

        // تحديث الاختيار وحساب المسافات
        function updateSelection(lat, lng, address) {
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);

            document.getElementById('addr').value = address;
            lastSelectedCoords = { lat, lng, address };

            // العثور على أقرب جامعة من القائمة القادمة من الـ API
            let nearest = null;
            let minDist = Infinity;

            universities.forEach(u => {
                // نستخدم latitude و longitude كما هي في الـ JSON بتاعك
                const d = Math.sqrt(Math.pow(lat - u.latitude, 2) + Math.pow(lng - u.longitude, 2));
                if (d < minDist) {
                    minDist = d;
                    nearest = u;
                }
            });

            if (nearest) {
                const kmDistance = calculateDistance(lat, lng, nearest.latitude, nearest.longitude);
                document.getElementById('uni').value = nearest.name;
                document.getElementById('distance').value = kmDistance + " كم";
                selectedUniversityId = nearest.universityId;
                document.getElementById('saveBtn').disabled = false;
            }
        }

        // حساب المسافة (Haversine Formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(2);
        }

        // النقر على الخريطة
        map.on('click', async function (e) {
            const { lat, lng } = e.latlng;
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
            const data = await res.json();
            updateSelection(lat, lng, data.display_name || "عنوان غير محدد");
        });

        // 2. دالة حفظ البيانات للباك-إند
        async function saveData() {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';

            // ملحوظة: الـ propertyId هنا 73 كمثال كما في الـ curl بتاعك، يفضل تمريره ديناميكياً مستقبلاً
            const payload = {
                propertyId: parseInt(propertyIdFromUrl),
                universityId: selectedUniversityId,
                address: lastSelectedCoords.address,
                lat: lastSelectedCoords.lat,
                lng: lastSelectedCoords.lng
            };

            try {
                const response = await fetch(`${API_BASE}/Location/SetPropertyLocation`, {
                    method: 'POST',
                    headers: {
                        'accept': '*/*',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("✅ تم حفظ موقع العقار بنجاح في السيرفر!");
                    window.location.href = "./dashbord-owner.html"
                } else {
                    const errorData = await response.json();
                    alert("❌ فشل الحفظ: " + (errorData.message || "خطأ غير معروف"));
                }
            } catch (error) {
                console.error("Error saving data:", error);
                alert("❌ حدث خطأ في الاتصال بالسيرفر.");
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>

</html>
