<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard | Homunity</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loader -->
    <div id="homunityLoader" class="loader-overlay d-none">
        <div class="spinner-container">
            <div class="spinner-border text-warning" role="status"></div>
            <h3 class="mt-3 text-white">HOMUNITY</h3>
        </div>
    </div>

    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../img/logo.png" alt="Logo">
                <span>Homunity</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li id="menu-list" class="active"><i class="fa-solid fa-house"></i> My Properties</li>
                    <li id="menu-add"><i class="fa-solid fa-plus-circle"></i> Add Property</li>
                    <li id="menu-bookings"><i class="fa-solid fa-calendar-check"></i> Bookings</li>
                    <li id="menu-messages"><i class="fa-solid fa-envelope"></i> Messages</li>
                    <li id="menu-settings"><i class="fa-solid fa-gear"></i> Settings</li>
                </ul>
            </nav>
            <div class="logout-btn" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Properties Grid -->
            <section id="section-list" class="dashboard-section animate-fade">
                <div class="stats-row mb-4">
                    <div class="stat-box">Total: <span id="stat-total">0</span></div>
                    <div class="stat-box gold">Approved: <span id="stat-approved">0</span></div>
                </div>
                <div id="propertiesGrid" class="row g-4"></div>
            </section>

            <!-- Add Property (Split Design) -->
            <section id="section-add" class="dashboard-section d-none">
                <form id="addPropertyForm">
                    <div class="form-card mb-4">
                        <h4 class="gold-text mb-4"><i class="fa-solid fa-info-circle"></i> Basic Information</h4>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label>Title</label>
                                <input type="text" id="add-title" class="form-control-custom" placeholder="e.g. Modern Student Room">
                            </div>
                            <div class="col-md-3">
                                <label>Price</label>
                                <input type="number" id="add-price" class="form-control-custom" placeholder="0.00">
                            </div>
                            <div class="col-md-3">
                                <label>Rooms</label>
                                <input type="number" id="add-rooms" class="form-control-custom" placeholder="1">
                            </div>
                        </div>
                    </div>

                    <div class="split-header">
                        <div class="split-label">Location Picker</div>
                        <div class="split-label">Amenities / Services</div>
                    </div>

                    <div class="row g-4">
                        <div class="col-lg-7">
                            <div class="map-container-wrapper">
                                <div id="map-add" class="leaflet-map"></div>
                                <div class="map-tools">
                                    <button type="button" class="btn-gps" onclick="forceGPS('add')">
                                        <i class="fa-solid fa-location-crosshairs"></i> Get Current Location (Precise)
                                    </button>
                                </div>
                                <div id="add-address-display" class="address-badge mt-2">No location selected</div>
                                <input type="hidden" id="add-lat">
                                <input type="hidden" id="add-lng">
                                <input type="hidden" id="add-fullAddress">
                            </div>
                        </div>
                        <div class="col-lg-5">
                            <div class="services-grid-wrapper" id="services-container">
                                <!-- Services checkboxes dynamically loaded here -->
                            </div>
                        </div>
                    </div>

                    <div class="form-card mt-4">
                        <label>Media (Images & Video)</label>
                        <div class="row">
                            <div class="col-md-6"><input type="file" id="add-images" multiple class="form-control mb-2" accept="image/*"></div>
                            <div class="col-md-6"><input type="file" id="add-video" class="form-control" accept="video/*"></div>
                        </div>
                        <button type="submit" class="btn-gold-main mt-4 w-100">Publish Property</button>
                    </div>
                </form>
            </section>

            <!-- Property Details (Gallery Stage) -->
            <section id="section-details" class="dashboard-section d-none">
                <button class="btn btn-sm btn-outline-dark mb-3" onclick="showSection('list')">
                    <i class="fa-solid fa-arrow-left"></i> Back to List
                </button>
                <div class="row">
                    <div class="col-lg-7">
                        <div class="gallery-stage">
                            <div id="main-media-box" class="main-display"></div>
                            <div id="thumbnails-strip" class="thumbs-nav"></div>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="details-info-card">
                            <h2 id="det-title" class="gold-text">Property Name</h2>
                            <p id="det-address" class="text-muted"><i class="fa-solid fa-map-pin"></i> Address loading...</p>
                            <hr>
                            <h5>Included Services:</h5>
                            <div id="det-services" class="det-services-list"></div>
                            <div id="map-details" class="mini-map mt-3"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- JS Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
