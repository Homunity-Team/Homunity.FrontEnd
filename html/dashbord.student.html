<!-- =====================================================
     HOMUNITY CHATBOT HTML
     أضف ده مباشرة قبل </body> في dashbord.student.html
     ===================================================== -->

<!-- Floating Button -->
<button id="homunity-chat-fab" onclick="toggleChat()" title="Chat with Homunity AI">
  <i class="fa-solid fa-robot" id="chatFabIcon"></i>
  <span class="chat-badge" id="chatBadge">1</span>
</button>

<!-- Chat Window -->
<div id="homunity-chat-window">
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-avatar">H</div>
    <div class="chat-header-info">
      <h4>Homunity AI Assistant</h4>
      <span>🟢 Online — مساعدك الذكي للسكن الطلابي</span>
    </div>
    <div class="chat-header-actions">
      <button class="chat-action-btn" onclick="clearChat()" title="مسح المحادثة">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button class="chat-action-btn" onclick="toggleChat()" title="إغلاق">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- Quick suggestions -->
  <div class="chat-quick-suggestions" id="quickSuggestions">
    <span class="quick-chip" onclick="sendQuick('أريد شقة قريبة من جامعة القاهرة')">🎓 قريب من جامعة القاهرة</span>
    <span class="quick-chip" onclick="sendQuick('ما هي أرخص الشقق المتاحة؟')">💰 أرخص الشقق</span>
    <span class="quick-chip" onclick="sendQuick('أريد شقة بها واي فاي وتكييف')">📶 واي فاي وتكييف</span>
    <span class="quick-chip" onclick="sendQuick('كيف أحجز شقة؟')">📋 كيف أحجز؟</span>
    <span class="quick-chip" onclick="sendQuick('أريد غرفة لطالب واحد')">🛏️ غرفة لطالب</span>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="chat-welcome">
      <div class="welcome-icon">🏠</div>
      <h3>أهلاً بك في Homunity!</h3>
      <p>أنا مساعدك الذكي، يمكنني مساعدتك في<br>إيجاد أفضل سكن طلابي مناسب لك.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" placeholder="اكتب رسالتك هنا..." rows="1"
      onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
    <button class="chat-send-btn" id="chatSendBtn" onclick="sendMessage()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>
