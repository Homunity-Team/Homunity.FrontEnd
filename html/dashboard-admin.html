<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/all.min.css" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/dashboard-admin.css" />
</head>

<body>
   <header class="header">
      <div class="header-left">
        <!-- Hamburger (mobile only) -->
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>

        <!-- Logo Icon Box -->
        <div class="logo-icon-box">
          <img src="../img/logo.png" alt="Logo" style="max-height: 70px" />
        </div>

        <!-- Logo Text -->
        <span class="logo-text">Student Dashboard</span>
      </div>
    </header>

    <!-- ══ SIDEBAR OVERLAY ══ -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <nav>
            <ul>
                <li class="active"><i class="fa-solid fa-house"></i> Dashboard</li>
                <li><i class="fa-solid fa-clock"></i> Pending Properties</li>
                <li><i class="fa-solid fa-xmark"></i> Rejected Properties</li>
            </ul>
        </nav>
        <div class="sidebar-logout" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </div>
    </aside>
    <main>

      <!-- admin dashboard  -->
<section class="d-none">
  
</section>

<!-- Pending Properties Page -->
<section class="d-none">
  
</section>


<!-- rejected properties pop-up  -->
<section class="d-none">
<div class="popup-overlay">
    <div class="popup-box">
        <div class="popup-header">
            Reject Property Popup
        </div>
        <div class="popup-body">
            <textarea 
                id="reasonInput"
                class="reason-box"
                placeholder="write reason"
                maxlength="300"
                oninput="countChars()"
            ></textarea>
            <div class="popup-footer">
                <span>⚠️ Please provide a reason for rejection</span>
                <span id="charCount">0 / 300</span>
            </div>
            <div class="popup-buttons">
                <button onclick="confirmAction()">Confirm</button>
                <button onclick="closePopup()">Cancel</button>
            </div>
        </div>
    </div>
</div>
</section>

<!--end-->

<!-- property details -->
<section class="d-none">
  
</section>


<!-- rejected properties -->
<section class="d-none">
  
</section>



    </main>
    <script>
    function countChars() {
        let text = document.getElementById("reasonInput").value;
        document.getElementById("charCount").innerText = text.length + " / 300";
    }

    function closePopup() {
        document.querySelector(".popup-overlay").style.display = "none";
    }

    function confirmAction() {
        let text = document.getElementById("reasonInput").value;

        if (text.trim() === "") {
            alert("Please write a reason first!");
            return;
        }

        alert("Submitted Successfully!");
    }
</script>
    <script>
      const hamburger = document.getElementById("hamburger");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");

      hamburger.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("open");
      });
      overlay.addEventListener("click", () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("open");
      });

      document.querySelectorAll(".sidebar nav ul li").forEach((li) => {
        li.addEventListener("click", () => {
          document
            .querySelectorAll(".sidebar nav ul li")
            .forEach((x) => x.classList.remove("active"));
          li.classList.add("active");
          if (window.innerWidth <= 900) {
            sidebar.classList.remove("open");
            overlay.classList.remove("open");
          }
        });
      });

      document.getElementById("logoutBtn").addEventListener("click", () => {
        if (confirm("Are you sure you want to logout?")) {
          localStorage.clear();
          window.location.href = "../index.html";
        }
      });

      document.querySelectorAll(".gallery-thumbs img").forEach((thumb) => {
        thumb.addEventListener("click", () => {
          document
            .querySelectorAll(".gallery-thumbs img")
            .forEach((t) => t.classList.remove("active"));
          thumb.classList.add("active");
        });
      });
    </script>
</body>

</html>
